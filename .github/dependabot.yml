version: 2
updates:
  # Bumps the commit SHA each action is pinned to, and the version comment beside it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A week, past pnpm-workspace.yaml's 3-day minimumReleaseAge: most malicious releases are
    # pulled within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Past minimumReleaseAge, so pnpm installs every version proposed.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
