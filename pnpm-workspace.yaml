# Each package is a root directory named for it: modkit, modkit-compiler, modkit-cli, ...
packages:
  - 'modkit*'
  - 'examples/*'
  - 'docs'

# Only install versions at least 3 days old: most malicious releases are pulled within hours.
minimumReleaseAge: 4320

# Fail when a release is published with less trust than earlier ones (e.g. a token upload after
# trusted publishing), the usual shape of an account-takeover release.
trustPolicy: no-downgrade
# Already pnpm 12's default; stated so the whole supply-chain policy is in one place.
blockExoticSubdeps: true

catalog:
  '@types/node': ^26.6.3
  es-toolkit: ^1.53.2
  scule: ^1.3.0
  typescript: ^7.0.2
  valibot: ^1.5.0

# pi's own dependencies, installed for pi's types, which need none of their install scripts.
allowBuilds:
  '@google/genai': false
  protobufjs: false

# opencode's own packages, installed for their types, bring in npm's tooling at versions with
# advisories. Nothing here runs it, so each is raised to its fixed release.
overrides:
  glob: ^14.0.2
  minimatch: ^11.0.1
