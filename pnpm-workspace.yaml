packages:
  - packages/*
  - packages/targets/*

# Only install versions at least 3 days old: most malicious releases are pulled within hours.
minimumReleaseAge: 4320

# Fail when a release is published with less trust than earlier ones (e.g. a token upload after
# trusted publishing), the usual shape of an account-takeover release.
trustPolicy: no-downgrade
# Already pnpm 12's default; stated so the whole supply-chain policy is in one place.
blockExoticSubdeps: true

catalog:
  '@types/node': ^26.6.3
  es-toolkit: ^1.53.2
  scule: ^1.3.0
  typescript: ^7.0.2
  valibot: ^1.5.0
