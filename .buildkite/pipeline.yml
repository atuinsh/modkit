# YAML anchors for the commands the steps repeat; Buildkite ignores this key.
common:
  - &restore buildkite-agent cache restore --name pnpm_store --name pnpm_verified
  - &install 'section ":package: Dependencies" pnpm install --frozen-lockfile'
  - &save buildkite-agent cache save --name pnpm_store --name pnpm_verified

steps:
  - label: ':typescript: modkit checks'
    key: modkit-checks
    image: 'ghcr.io/atuinsh/ci:main'
    timeout_in_minutes: 15
    command:
      - *restore
      - *install
      - *save
      - 'section ":art: Format" pnpm fmt:check'
      - 'section ":hammer: Typecheck" pnpm typecheck'
      - 'section ":mag_right: Oxlint" pnpm lint'
      - 'section ":scissors: Knip" pnpm knip'
      - 'section ":pencil2: Codespell" pnpm spell'

  # Known vulnerabilities in the locked dependencies: on a lockfile change, and on every build
  # that doesn't apply if_changed, so an advisory published later still turns a build red.
  - label: ':shield: modkit advisories'
    key: modkit-advisories
    if_changed: 'pnpm-lock.yaml'
    image: 'ghcr.io/atuinsh/ci:main'
    timeout_in_minutes: 10
    env:
      OSV_SCANNER_VERSION: '2.7.1'
      OSV_SCANNER_SHA256: 'fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8'
    command:
      - curl -fsSL --retry 3 --retry-all-errors -o /tmp/osv-scanner "https://github.com/google/osv-scanner/releases/download/v$${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
      - echo "$${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
      - chmod +x /tmp/osv-scanner
      - 'section ":shield: OSV-Scanner" /tmp/osv-scanner scan source --lockfile pnpm-lock.yaml'
