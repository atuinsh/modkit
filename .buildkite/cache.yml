caches:
  - name: pnpm_store
    cache_key:
      - pnpm-store
      - v1
      - agent: os
      - agent: arch
        fallback_limit: true
      - checksum: pnpm-lock.yaml
    target_paths:
      - ~/.local/share/pnpm/store

  - name: pnpm_verified
    cache_key:
      - pnpm-verified
      - v1
      - checksum:
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - package.json
    target_paths:
      - ~/.cache/pnpm/lockfile-verified.jsonl
